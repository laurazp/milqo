name: milqo_flutter
description: "Milqo — calculadora, recetas y conversor de bebidas vegetales caseras."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + navigation — same base as our Flutter MVVM template
  # (Flutter/Flutter template): Riverpod notifiers/providers, go_router with
  # a StatefulShellRoute for the 4 bottom tabs.
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0

  # Local persistence for favorites and saved calculations (no backend in v1)
  shared_preferences: ^2.2.3

  # Títulos y botones en Poppins (ver Identidad visual del MVP)
  google_fonts: ^6.2.1

  # Compartir resultado/receta como texto (icono de compartir en Resultado y Detalle de receta)
  share_plus: ^7.2.2

  # Abrir la fuente original de una receta en el navegador
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
